omni_camera:
  enabled: true # Set true after the rear camera is installed.
  camera_name: "hikrobot"
  exposure_ms: 1.5
  frame_rate: 15 # 0 or lower means unlimited
  gain: 16.9
  vid_pid: "2bdf:0001"
