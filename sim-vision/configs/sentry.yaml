# enemy_color: "red"
enemy_color: "blue"

# Armor numbers to ignore: 1 hero, 2 engineer, 3/4 infantry, 5 infantry, 6 sentry, 7 outpost, 8 base.
ignore_num: [2]
# Armor numbers to prefer; omni also publishes status 2 after seeing one for more than 5 frames.
priority_num: []


#####-----神经网络参数-----#####
yolo_name: yolov5
# Default development target: Orin Nano, using the tested direct-ONNX CUDA path.
# Change to "openvino" only for the Intel NUC deployment configuration.
inference_backend: opencv_dnn_cuda
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/20260726batch16.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
# Model used by the Orin Nano OpenCV DNN CUDA backend.
yolov5_onnx_model_path: assets/best2-sim.onnx
device: GPU
min_confidence: 0.75
use_traditional: false
fast_yolo_filter: false
fast_yolo_geometry_filter: false
fast_yolo_color_filter: false
fast_yolo_min_light_ratio: 0.45
fast_yolo_max_light_angle_diff: 18
fast_yolo_color_dominance: 1.05
fast_yolo_color_min_ratio: 0.35
fast_yolo_color_stride: 2
fast_yolo_color_min_samples: 4

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

