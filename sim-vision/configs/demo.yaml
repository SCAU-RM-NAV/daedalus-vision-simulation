# enemy_color: "red"
enemy_color: "blue"

# Armor numbers to ignore: 1 hero, 2 engineer, 3/4 infantry, 5 infantry, 6 sentry, 7 outpost, 8 base.
ignore_num: []
# Armor numbers to prefer; leave empty to keep the default target order.
priority_num: []

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/20260726batch16.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: true
fast_yolo_filter: true
fast_yolo_geometry_filter: true
fast_yolo_color_filter: true
fast_yolo_min_light_ratio: 0.45
fast_yolo_max_light_angle_diff: 18
fast_yolo_color_dominance: 1.05
fast_yolo_color_min_ratio: 0.35
fast_yolo_color_stride: 2
fast_yolo_color_min_samples: 4

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

# true = always use the latest observation, false = normal EKF prediction,
# auto = enable observation-only after the recent Z range exceeds the threshold below.
z_observation_only: false
z_observation_auto_window_frames: 150
z_observation_auto_range_threshold: 0.15 # m

#####-----aimer参数-----#####
yaw_offset: -1 # degree -2.5
pitch_offset: -1.4 # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
outpost_comming_angle: 70 # degree
outpost_leaving_angle: 30 # degree
decision_speed: 8 # rad/s
high_speed_delay_time: 0.030 # s
low_speed_delay_time: 0.015 # s
outpost_delay_time: 0.0 # s

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 2
gain: 16
vid_pid: "2bdf:0001"

# -1  0  0
#  0 -1  0
#  0  0  1
R_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]

# 重投影误差: 0.2697px
camera_matrix: [1818.3669452465165, 0, 751.06226574703498, 0, 1822.494494078506, 530.43671556112133, 0, 0, 1]
distort_coeffs: [-0.077944626599568856, 0.15447826031486889, -0.0025714394278524674, 0.00083016311301273629, 0]

# 相机同理想情况的偏角: yaw0.46 pitch0.61 roll-1.53 degree
R_camera2gimbal: [-0.0083195760046954614, 0.010498791137270739, 0.99991027599468041, -0.99960756138647755, -0.026835747568381807, -0.0080352891314148939, 0.026748978935305992, -0.99958472279097077, 0.010717933047771133]
t_camera2gimbal: [0.094969301833534511, 0.095006290298006682, 0.050987066291756609]

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"

#####-----planner-----#####
fire_thresh: 0.003
# 锁中心：高速旋转时 yaw 瞄整车中心，pitch 仍按当前可打装甲板高度计算
aim_center_enable: true              # 总开关：false 时完全不启用锁中心
aim_center_near_spin_enable: true    # 近距离高转速锁中心条件开关
aim_center_near_spin_w: 5.5          # 近距离锁中心角速度阈值，abs(w) 大于该值才触发，rad/s
aim_center_near_distance: 2.5        # 近距离锁中心距离阈值，目标中心距离小于该值才触发，m
aim_center_spin_enable: true         # 全距离高转速锁中心条件开关
aim_center_spin_w: 5.0               # 全距离锁中心角速度阈值，abs(w) 大于该值触发，rad/s
aim_center_shoot_yaw: 6.0            # 锁中心时未来装甲板中心方位与当前中心瞄准线的允许误差，degree
aim_center_enter_step: 50            # 满足锁中心条件时滞回计数每帧增加量，越大进入越快
aim_center_exit_step: 30             # 不满足条件时滞回计数每帧减少量，影响下次再触发的进入速度
aim_center_hold_threshold: 100       # 当前帧满足触发且计数高于该值时才进入锁中心
aim_center_hold_max: 400             # 滞回计数上限

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6,0]
R_pitch: [1]

#####-----buff_detector参数-----#####
detect:
  contrast: 1
  brightness: 
    blue: -120
    red: -100
  brightness_threshold:
    blue: 120
    red: 40
  morphology_size:
    blue: 3
    red: 3
  dilate_size: 2
  # canny_low_threshold: 100
  # canny_high_threshold: 180
  # approx_epsilon: 1.0
  R_contours_min_area: 200
  R_contours_max_area: 600
  fanblades_head_contours_min_area: 3000
  fanblades_head_contours_max_area: 8000
  fanblades_body_contours_min_area: 1000
  fanblades_body_contours_max_area: 4000
  standard_fanblade_path: ./assets/standard_fanblade.jpg

#####-----buff_aimer参数-----#####
aim_time: 0.150         # s
wait_time: 0.300        # s
command_fire_gap: 0.080 # s
predict_time: 0.150     # s

#####-----Buff configuration-----#####
buff_detector:
  model: "assets/buff_pose_f32/best.xml"
  openvino:
    device: CPU
    num_requests: 2
    result_queue_size: 2
  conf_threshold: 0.7
  nms_threshold: 0.4
  kpt_conf_threshold: 0.5
  buff_center_roi_enable: true
  buff_center_roi_size: 960
  r_center_refine: false
  r_center_refine_threshold: 100
  r_center_refine_radius_scale: 0.3
  r_center_refine_kernel_size: 3
  r_center_refine_hierarchy_filter: true
  r_center_refine_max_child_area_ratio: 0.50
pnp:
  max_reprojection_error: 5.0
fire_gap_time: 0.700
predictor:
  mode: "big"
  small_predictor: "ceres"
  min_time_change: 0.0001
  big_queue_size: 300
  small_queue_size: 200
  small_ekf_p0_angle: 0.02
  small_ekf_p0_speed: 0.01
  small_ekf_q_accel: 0.001
  small_ekf_r_angle: 0.1
id_tracking:
  max_match_angle: 0.30
  min_residual_margin: 0.10
  max_id_angular_speed: 4.0
  max_zero_phase_innovation_rad: 0.30
  coast_timeout_sec: 0.08
  reset_timeout_sec: 0.20
  model_min_confirmed_frames: 3
  model_max_nis: 9.0
fitting:
  big_min_fit_size: 150
  small_min_fit_size: 100
  timeout_sec: 3.0
  big_a_min: 0.780
  big_a_max: 1.045
  big_w_min: 1.884
  big_w_max: 2.000
  huber_delta: 0.1
  omega_a: 50.0
  omega_w: 80.0
  big_cold_start_coarse_steps: 64
  big_cold_start_refine_steps: 16
  max_iterations: 50
  ceres_threads: 2
  big_cost_threshold: 0.005
  small_cost_threshold: 0.001
  small_huber_delta: 0.1
target_selection:
  w_yaw: 1.0
  w_pitch: 0.8
  switch_margin: 0.02
  switch_frames: 3
command_guard:
  hold_last_leaf_sec: 0.05
  fire_rearm_confirmed_frames: 3
  max_yaw_rate: 2.0
  max_pitch_rate: 2.0
  max_slew_dt_sec: 0.02
ballistic:
  small_bias_time_ms: 120.0
  big_bias_time_ms: 120.0
  default_bullet_speed: 24.0
  energy_yaw_bias: 0.0
  energy_pitch_bias: 0.0
  fixed_iterations: 3
  target_radius: 0.700
  attack_leaf_center: true
  model: standard
  min_bullet_speed: 10.0
  max_bullet_speed: 1000000000.0
  hero_air_resistance_k: 0.000556
  hero_s_bias: 0.2
  hero_imu_pitch: 0.0
  hero_rk_iter: 60
  ballistic_debug: false
  ballistic_debug_interval: 0.5
pose_filter:
  enabled: true
  max_dt_sec: 0.25
  p0_r_yaw: 10.0
  p0_r_v_yaw: 10.0
  p0_r_pitch: 10.0
  p0_r_dist: 10.0
  p0_buff_yaw: 10.0
  q_r_yaw_accel: 0.001
  q_r_pitch: 0.001
  q_r_dist: 0.01
  q_buff_yaw: 0.01
  r_r_yaw: 0.01
  r_r_pitch: 0.01
  r_r_dist: 0.5
  r_buff_yaw: 0.1
  r_blade_yaw: 0.01
  r_blade_pitch: 0.01
  r_blade_dist: 0.5
